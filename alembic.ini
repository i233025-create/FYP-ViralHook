# Alembic CLI config for the product database (backend/).
# The server migrates automatically on startup; use the CLI only to create a
# new migration after changing backend/models.py:
#   module1_style_extraction\venv\Scripts\python.exe -m alembic revision --autogenerate -m "describe change"
#   module1_style_extraction\venv\Scripts\python.exe -m alembic upgrade head
# The database URL comes from DATABASE_URL (default: data/viralhook.db).

[alembic]
script_location = backend/migrations
prepend_sys_path = .
