name: CI — ViralHook

on:
  push:
    branches: ["**"]          # run on every branch push
  pull_request:
    branches: [main, dev]     # run on PRs targeting main or dev

jobs:
  # ── Job 1: Python backend quality ─────────────────────────────────────────
  backend-quality:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight subset — no torch/whisper/CLIP for CI speed
          pip install \
            fastapi==0.111.0 \
            uvicorn==0.29.0 \
            pydantic==2.7.1 \
            python-dotenv==1.0.1 \
            langchain==0.1.20 \
            langchain-community==0.0.38 \
            langchain-groq==0.1.3 \
            langchain-huggingface==0.0.3 \
            sentence-transformers==2.7.0 \
            chromadb==0.4.24 \
            "numpy<2" \
            qdrant-client==1.9.1 \
            scikit-learn==1.9.0 \
            requests==2.34.2 \
            rich==13.7.1 \
            pytest==8.2.0 \
            flake8==7.0.0

      - name: Lint with flake8
        run: |
          flake8 server.py pipeline/ module2_multimodal_rag/ tests/backend/ \
            --count --statistics
        continue-on-error: false

      - name: Run backend tests
        run: |
          pytest tests/backend/ -v --tb=short
        env:
          # GROQ_API_KEY not set — integration tests will be skipped automatically
          PYTHONPATH: ${{ github.workspace }}

  # ── Job 2: Frontend quality ────────────────────────────────────────────────
  frontend-quality:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_extracted/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend_extracted/frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend_extracted/frontend
        run: npm run build
        # Build success = no JS/JSX syntax errors, no missing imports

  # ── Job 3: Integration gate ────────────────────────────────────────────────
  # Summary job — PRs to main/dev must pass both jobs above
  ci-gate:
    name: CI Gate
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "Backend quality check failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "Frontend build check failed"
            exit 1
          fi
          echo "All CI checks passed"
